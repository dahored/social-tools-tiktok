services:
  social-tools-tiktok-web:
    build: .
    container_name: social-tools-tiktok-web
    ports:
      - "40005:40005"
    volumes:
      - app-data:/app/data
      - ./storage/transitions:/app/storage/transitions
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # inside Docker "localhost" is the container itself — talk to the mongo service
      - MONGO_URI=mongodb://mongo:27017/social-tools-tiktok
    depends_on:
      - mongo

  # Renders scene-transition videos for the editor's "Descargar video" button
  renderer:
    build:
      context: .
      dockerfile: video/Dockerfile
    container_name: social-tools-renderer
    volumes:
      - ./storage/transitions:/app/storage/transitions
    environment:
      - RENDER_SERVER=http://social-tools-tiktok-web:40005
    depends_on:
      - social-tools-tiktok-web
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: social-tools-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  app-data:
  mongo-data:
