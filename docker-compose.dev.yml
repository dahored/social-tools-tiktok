services:
  social-tools-tiktok-web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: social-tools-tiktok-web-dev
    ports:
      - "4050:4050"
    volumes:
      - .:/app
      - /app/node_modules
      - app-data:/app/data
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development

volumes:
  app-data: