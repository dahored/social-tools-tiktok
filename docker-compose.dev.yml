services:
  social-tools-tiktok-web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: social-tools-tiktok-web-dev
    ports:
      - "4050:4050"
    volumes:
      - .:/app
      - /app/node_modules
      - app-data:/app/data
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/social-tools-tiktok
    depends_on:
      - mongo

  # Renders scene-transition videos for the editor's "Descargar video" button
  renderer:
    build:
      context: .
      dockerfile: video/Dockerfile
    container_name: social-tools-renderer-dev
    volumes:
      # live widget/font changes + shared output folder served by the web app
      - ./widgets:/app/widgets:ro
      - ./assets:/app/assets:ro
      - ./video/render-lib.mjs:/app/video/render-lib.mjs:ro
      - ./video/render-worker.mjs:/app/video/render-worker.mjs:ro
      - ./storage/transitions:/app/storage/transitions
    environment:
      - RENDER_SERVER=http://social-tools-tiktok-web:4050
    # reload when render-lib / render-worker change
    command: ["node", "--watch", "render-worker.mjs"]
    depends_on:
      - social-tools-tiktok-web
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: social-tools-mongo-dev
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  app-data:
  mongo-data: