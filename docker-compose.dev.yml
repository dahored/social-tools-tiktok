services:
  social-tools-tiktok-web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: social-tools-tiktok-web-dev
    ports:
      - "4050:4050"
    volumes:
      - .:/app
      - /app/node_modules
      - app-data:/app/data
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/social-tools-tiktok
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: social-tools-mongo-dev
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  app-data:
  mongo-data: