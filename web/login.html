<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Social Tools TikTok</title>
  <style>
    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --surface-2: #18181f;
      --surface-3: #1f1f28;
      --border:    #2a2a38;
      --border-2:  #35354a;
      --text:      #f0f0f5;
      --text-2:    #a0a0b8;
      --text-3:    #6a6a82;
      --tt-red:    #ff0050;
      --tt-cyan:   #00f2ea;
      --tt-glow-r: rgba(255,0,80,.18);
      --tt-glow-c: rgba(0,242,234,.12);
      --green:     #22c55e;
      --danger:    #f87171;
      --radius:    16px;
      --radius-sm: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 60% 40% at 10% -5%, var(--tt-glow-r), transparent),
        radial-gradient(ellipse 50% 35% at 90% 5%,  var(--tt-glow-c), transparent);
    }

    /* ── Brand ──────────────────────────────────────────────── */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      text-decoration: none;
      color: var(--text);
    }

    .brand-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--tt-red), #c400d6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 0 16px var(--tt-glow-r);
    }

    .brand-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* ── Card ───────────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .card-sub {
      color: var(--text-2);
      font-size: 0.875rem;
      margin-bottom: 28px;
    }

    /* ── Form ───────────────────────────────────────────────── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 18px;
    }

    label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-2);
    }

    input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.9rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      width: 100%;
      font-family: inherit;
    }

    input::placeholder { color: var(--text-3); }

    input:focus {
      border-color: var(--tt-cyan);
      box-shadow: 0 0 0 3px rgba(0,242,234,.1);
    }

    input.error { border-color: var(--danger); }

    /* ── Alert ──────────────────────────────────────────────── */
    .alert {
      display: none;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .alert-error {
      background: rgba(248,113,113,.08);
      border: 1px solid rgba(248,113,113,.25);
      color: var(--danger);
    }

    .alert-success {
      background: rgba(34,197,94,.08);
      border: 1px solid rgba(34,197,94,.25);
      color: var(--green);
    }

    .alert.visible { display: block; }

    /* ── Button ─────────────────────────────────────────────── */
    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: none;
      background: linear-gradient(135deg, var(--tt-red), #d4006b);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      font-family: inherit;
      letter-spacing: 0.01em;
      box-shadow: 0 2px 16px rgba(255,0,80,.25);
      margin-top: 4px;
    }

    .btn-submit:hover   { opacity: .9; }
    .btn-submit:active  { transform: scale(.98); }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Footer ─────────────────────────────────────────────── */
    .card-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-2);
    }

    .card-footer a {
      color: var(--tt-cyan);
      text-decoration: none;
      font-weight: 500;
    }

    .card-footer a:hover { text-decoration: underline; }

    /* ── Spinner ─────────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <a class="brand" href="/">
    <div class="brand-icon">🎬</div>
    <span class="brand-name">Social Tools TikTok</span>
  </a>

  <div class="card">
    <h1 class="card-title">Welcome back</h1>
    <p class="card-sub">Sign in to your account</p>

    <div class="alert alert-error" id="alertError"></div>
    <div class="alert alert-success" id="alertSuccess"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <button class="btn-submit" type="submit" id="submitBtn">
        Sign in
      </button>
    </form>

    <div class="card-footer">
      Don't have an account? <a href="/register.html">Register</a>
    </div>
  </div>

  <script>
    const form       = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passInput  = document.getElementById('password');
    const submitBtn  = document.getElementById('submitBtn');
    const alertError = document.getElementById('alertError');
    const alertSuccess = document.getElementById('alertSuccess');

    // Redirect if already logged in
    if (localStorage.getItem('stt_token')) {
      window.location.href = '/';
    }

    function showError(msg) {
      alertError.textContent = msg;
      alertError.classList.add('visible');
      alertSuccess.classList.remove('visible');
    }

    function showSuccess(msg) {
      alertSuccess.textContent = msg;
      alertSuccess.classList.add('visible');
      alertError.classList.remove('visible');
    }

    function clearAlerts() {
      alertError.classList.remove('visible');
      alertSuccess.classList.remove('visible');
    }

    function setLoading(on) {
      submitBtn.disabled = on;
      submitBtn.innerHTML = on
        ? '<span class="spinner"></span>Signing in…'
        : 'Sign in';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlerts();

      const email    = emailInput.value.trim();
      const password = passInput.value;

      if (!email || !password) {
        showError('Email and password are required.');
        return;
      }

      setLoading(true);
      try {
        const res = await fetch('/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Login failed.');
          return;
        }

        localStorage.setItem('stt_token', data.token);
        localStorage.setItem('stt_user',  JSON.stringify(data.user));

        showSuccess('Login successful! Redirecting…');
        setTimeout(() => { window.location.href = '/'; }, 800);
      } catch {
        showError('Network error. Is the server running?');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
