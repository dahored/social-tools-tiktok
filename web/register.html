<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Social Tools TikTok</title>
  <style>
    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --surface-2: #18181f;
      --surface-3: #1f1f28;
      --border:    #2a2a38;
      --border-2:  #35354a;
      --text:      #f0f0f5;
      --text-2:    #a0a0b8;
      --text-3:    #6a6a82;
      --tt-red:    #ff0050;
      --tt-cyan:   #00f2ea;
      --tt-glow-r: rgba(255,0,80,.18);
      --tt-glow-c: rgba(0,242,234,.12);
      --green:     #22c55e;
      --danger:    #f87171;
      --radius:    16px;
      --radius-sm: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 60% 40% at 10% -5%, var(--tt-glow-r), transparent),
        radial-gradient(ellipse 50% 35% at 90% 5%,  var(--tt-glow-c), transparent);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      text-decoration: none;
      color: var(--text);
    }

    .brand-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--tt-red), #c400d6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 0 16px var(--tt-glow-r);
    }

    .brand-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .card-sub {
      color: var(--text-2);
      font-size: 0.875rem;
      margin-bottom: 28px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 18px;
    }

    label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-2);
    }

    input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.9rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      width: 100%;
      font-family: inherit;
    }

    input::placeholder { color: var(--text-3); }

    input:focus {
      border-color: var(--tt-cyan);
      box-shadow: 0 0 0 3px rgba(0,242,234,.1);
    }

    input.error { border-color: var(--danger); }

    /* ── Password strength bar ──────────────────────────────── */
    .strength-wrap {
      margin-top: 6px;
      display: flex;
      gap: 4px;
    }

    .strength-seg {
      height: 3px;
      flex: 1;
      border-radius: 2px;
      background: var(--border);
      transition: background .2s;
    }

    .strength-seg.weak   { background: var(--danger); }
    .strength-seg.medium { background: #f59e0b; }
    .strength-seg.strong { background: var(--green); }

    .strength-label {
      font-size: 0.75rem;
      color: var(--text-3);
      margin-top: 4px;
    }

    /* ── Field hint ─────────────────────────────────────────── */
    .field-hint {
      font-size: 0.75rem;
      color: var(--text-3);
    }

    /* ── Alert ──────────────────────────────────────────────── */
    .alert {
      display: none;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .alert-error   { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.25); color: var(--danger); }
    .alert-success { background: rgba(34,197,94,.08);   border: 1px solid rgba(34,197,94,.25);   color: var(--green); }
    .alert.visible { display: block; }

    /* ── Validation list ────────────────────────────────────── */
    .val-list {
      list-style: none;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .val-item {
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-3);
      transition: color .15s;
    }

    .val-item.ok { color: var(--green); }

    .val-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* ── Button ─────────────────────────────────────────────── */
    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: none;
      background: linear-gradient(135deg, var(--tt-red), #d4006b);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      font-family: inherit;
      letter-spacing: 0.01em;
      box-shadow: 0 2px 16px rgba(255,0,80,.25);
      margin-top: 4px;
    }

    .btn-submit:hover   { opacity: .9; }
    .btn-submit:active  { transform: scale(.98); }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

    .card-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-2);
    }

    .card-footer a {
      color: var(--tt-cyan);
      text-decoration: none;
      font-weight: 500;
    }

    .card-footer a:hover { text-decoration: underline; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <a class="brand" href="/">
    <div class="brand-icon">🎬</div>
    <span class="brand-name">Social Tools TikTok</span>
  </a>

  <div class="card">
    <h1 class="card-title">Create account</h1>
    <p class="card-sub">Join Social Tools TikTok</p>

    <div class="alert alert-error"   id="alertError"></div>
    <div class="alert alert-success" id="alertSuccess"></div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" type="text" placeholder="Your name" autocomplete="name" required />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Min. 8 characters" autocomplete="new-password" required />
        <div class="strength-wrap">
          <div class="strength-seg" id="seg1"></div>
          <div class="strength-seg" id="seg2"></div>
          <div class="strength-seg" id="seg3"></div>
          <div class="strength-seg" id="seg4"></div>
        </div>
        <span class="strength-label" id="strengthLabel"></span>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" placeholder="Repeat password" autocomplete="new-password" required />
      </div>

      <ul class="val-list" id="valList">
        <li class="val-item" id="v-length"><span class="val-dot"></span>At least 8 characters</li>
        <li class="val-item" id="v-match"><span class="val-dot"></span>Passwords match</li>
        <li class="val-item" id="v-email"><span class="val-dot"></span>Valid email address</li>
        <li class="val-item" id="v-name"><span class="val-dot"></span>Name provided</li>
      </ul>

      <button class="btn-submit" type="submit" id="submitBtn">Create account</button>
    </form>

    <div class="card-footer">
      Already have an account? <a href="/login.html">Sign in</a>
    </div>
  </div>

  <script>
    const form        = document.getElementById('registerForm');
    const nameInput   = document.getElementById('name');
    const emailInput  = document.getElementById('email');
    const passInput   = document.getElementById('password');
    const confInput   = document.getElementById('confirm');
    const submitBtn   = document.getElementById('submitBtn');
    const alertError  = document.getElementById('alertError');
    const alertSuccess = document.getElementById('alertSuccess');
    const segs        = [1,2,3,4].map(i => document.getElementById('seg' + i));
    const strengthLbl = document.getElementById('strengthLabel');

    // ── Validation helpers ────────────────────────────────────
    function setRule(id, ok) {
      document.getElementById(id).classList.toggle('ok', ok);
    }

    function calcStrength(pwd) {
      let score = 0;
      if (pwd.length >= 8)                          score++;
      if (pwd.length >= 12)                         score++;
      if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd))  score++;
      if (/[0-9]/.test(pwd) && /[^A-Za-z0-9]/.test(pwd)) score++;
      return score; // 0–4
    }

    function updateStrength(pwd) {
      const score = calcStrength(pwd);
      const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
      const classes = ['', 'weak', 'weak', 'medium', 'strong'];

      segs.forEach((s, i) => {
        s.className = 'strength-seg';
        if (i < score) s.classList.add(classes[score]);
      });

      strengthLbl.textContent = pwd.length ? labels[score] : '';
    }

    function isValidEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }

    // ── Live validation ───────────────────────────────────────
    [nameInput, emailInput, passInput, confInput].forEach(el => {
      el.addEventListener('input', () => {
        setRule('v-length', passInput.value.length >= 8);
        setRule('v-match',  passInput.value === confInput.value && confInput.value.length > 0);
        setRule('v-email',  isValidEmail(emailInput.value.trim()));
        setRule('v-name',   nameInput.value.trim().length > 0);
        updateStrength(passInput.value);
      });
    });

    // ── Alerts ────────────────────────────────────────────────
    function showError(msg) {
      alertError.textContent = msg;
      alertError.classList.add('visible');
      alertSuccess.classList.remove('visible');
    }

    function showSuccess(msg) {
      alertSuccess.textContent = msg;
      alertSuccess.classList.add('visible');
      alertError.classList.remove('visible');
    }

    function clearAlerts() {
      alertError.classList.remove('visible');
      alertSuccess.classList.remove('visible');
    }

    function setLoading(on) {
      submitBtn.disabled = on;
      submitBtn.innerHTML = on
        ? '<span class="spinner"></span>Creating account…'
        : 'Create account';
    }

    // ── Submit ────────────────────────────────────────────────
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlerts();

      const name     = nameInput.value.trim();
      const email    = emailInput.value.trim();
      const password = passInput.value;
      const confirm  = confInput.value;

      if (!name)                        return showError('Name is required.');
      if (!isValidEmail(email))         return showError('Enter a valid email address.');
      if (password.length < 8)          return showError('Password must be at least 8 characters.');
      if (password !== confirm)         return showError('Passwords do not match.');

      setLoading(true);
      try {
        // Include token if an admin is creating a user
        const token = localStorage.getItem('stt_token');
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;

        const res = await fetch('/auth/register', {
          method:  'POST',
          headers,
          body: JSON.stringify({ name, email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          const detail = data.details?.map(d => d.message).join(', ');
          showError(detail || data.error || 'Registration failed.');
          return;
        }

        showSuccess('Account created! Redirecting to login…');
        setTimeout(() => { window.location.href = '/login.html'; }, 1000);
      } catch {
        showError('Network error. Is the server running?');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
